syntax = "proto3";

package allegro;
option go_package = "./allegro";

message GetAllegroJobRequest {
  string job_id = 1;
}

message GetAllegroJobResponse {
  string status = 1;
  int32 product_count = 2;
  string ai_output = 3;
}

service AllegroService {
  rpc GetAllegroJob(GetAllegroJobRequest) returns (GetAllegroJobResponse);
}
