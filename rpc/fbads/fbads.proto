syntax = "proto3";

package fbads;
option go_package = "./fbads";

message GetFbAdsJobRequest {
  string job_id = 1;
}

message GetFbAdsJobResponse {
  string status = 1;
  int32 ad_count = 2;
  string ai_output = 3;
}

service FbAdsService {
  rpc GetFbAdsJob(GetFbAdsJobRequest) returns (GetFbAdsJobResponse);
}
