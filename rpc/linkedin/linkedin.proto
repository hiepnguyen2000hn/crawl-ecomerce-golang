syntax = "proto3";

package linkedin;
option go_package = "./linkedin";

message GetLinkedInJobRequest {
  string job_id = 1;
}

message GetLinkedInJobResponse {
  string status = 1;
  int32 post_count = 2;
  string ai_output = 3;
}

message GetLinkedInPostsRequest {
  string job_id = 1;
}

message LinkedInPost {
  string post_id = 1;
  string url = 2;
  string content = 3;
  string author_name = 4;
  string author_url = 5;
  string posted_at = 6;
  int32 likes = 7;
  int32 comments_count = 8;
  int32 shares = 9;
  string raw = 10;
}

message GetLinkedInPostsResponse {
  repeated LinkedInPost posts = 1;
}

service LinkedInService {
  rpc GetLinkedInJob(GetLinkedInJobRequest) returns (GetLinkedInJobResponse);
  rpc GetLinkedInPosts(GetLinkedInPostsRequest) returns (GetLinkedInPostsResponse);
}
