syntax = "proto3";

package linkedin;
option go_package = "./linkedin";

message GetLinkedInJobRequest {
  string job_id = 1;
}

message GetLinkedInJobResponse {
  string status = 1;
  int32 post_count = 2;
  string ai_output = 3;
}

service LinkedInService {
  rpc GetLinkedInJob(GetLinkedInJobRequest) returns (GetLinkedInJobResponse);
}
