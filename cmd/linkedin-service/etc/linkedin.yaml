Name: linkedin-service
ListenOn: 0.0.0.0:8092
Postgres:
  DSN: postgres://crawl:crawl@localhost:5433/crawl?sslmode=disable
RabbitMQ:
  URL: amqp://guest:guest@localhost:5673/
  Exchange: crawl
  Concurrency: 10
Apify:
  ApiToken: ${APIFY_API_TOKEN}
  ActorID: harvestapi/linkedin-post-search
  BaseURL: https://api.apify.com/v2
  MaxConcurrencyPerToken: 5
