Name: kalodata-service
ListenOn: 0.0.0.0:8093
Postgres:
  DSN: postgres://crawl:crawl@postgres:5432/crawl?sslmode=disable
RabbitMQ:
  URL: amqp://guest:guest@rabbitmq:5672/
  Exchange: crawl
  Concurrency: 10
Kalodata:
  BaseURL: https://www.kalodata.com
  CDNBase: https://img.kalocdn.com
  AccountsFile: /etc/kalodata-service/kalodata_accounts.json
  Cookies: ${KALODATA_COOKIES}
  CookieTTL: 168h
  DailySearchQuota: 10
  DailyDetailQuota: 10
  Python: /app/venv/bin/python
  SearchScript: /app/cmd/kalodata-service/crawler/search.py
  Retries: 3
