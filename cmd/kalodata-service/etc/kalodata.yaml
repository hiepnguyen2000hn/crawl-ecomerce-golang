Name: kalodata-service
ListenOn: 0.0.0.0:8093
Postgres:
  DSN: postgres://crawl:crawl@localhost:5433/crawl?sslmode=disable
RabbitMQ:
  URL: amqp://guest:guest@localhost:5673/
  Exchange: crawl
  Concurrency: 10
Kalodata:
  BaseURL: https://www.kalodata.com
  CDNBase: https://img.kalocdn.com
  Cookies: ${KALODATA_COOKIES}
  CookieTTL: 168h
  DailySearchQuota: 10
  DailyDetailQuota: 10
  Retries: 3
