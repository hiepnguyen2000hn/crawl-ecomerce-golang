Postgres:
  DSN: postgres://crawl:crawl@localhost:5433/crawl?sslmode=disable
RabbitMQ:
  URL: amqp://guest:guest@localhost:5673/
  Exchange: crawl
OpenRouter:
  ApiKey: ${OPENROUTER_API_KEY}
  Model: dots-studio/dots-3-note-preview:free
  # Tried in order if Model fails (free-tier models get overloaded); add
  # more verified free model slugs from openrouter.ai/models as needed.
  FallbackModels:
    - nvidia/nemotron-3-super-120b-a12b:free
  BaseURL: https://openrouter.ai/api/v1
Crawl4ai:
  BaseURL: http://localhost:8000
