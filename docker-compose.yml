services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crawl
      POSTGRES_USER: crawl
      POSTGRES_PASSWORD: crawl
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawl -d crawl"]
      interval: 2s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./db/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-path", "/migrations", "-database", "postgres://crawl:crawl@postgres:5432/crawl?sslmode=disable", "up"]
    restart: "no"

  trend-service:
    build:
      context: .
      dockerfile: cmd/trend-service/Dockerfile
    environment:
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    restart: on-failure:5

  ai-service:
    build:
      context: .
      dockerfile: cmd/ai-service/Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5

  api-gateway:
    build:
      context: .
      dockerfile: cmd/api-gateway/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      trend-service:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "8888:8888"
    restart: on-failure:5

volumes:
  pgdata:
