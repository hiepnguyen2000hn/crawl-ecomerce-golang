services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crawl
      POSTGRES_USER: crawl
      POSTGRES_PASSWORD: crawl
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawl -d crawl"]
      interval: 2s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./db/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-path", "/migrations", "-database", "postgres://crawl:crawl@postgres:5432/crawl?sslmode=disable", "up"]
    restart: "no"

  trend-service:
    build:
      context: .
      dockerfile: cmd/trend-service/Dockerfile
    environment:
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Không map cổng ra host để chạy được nhiều bản sao; gateway gọi gRPC qua mạng nội bộ.
    expose:
      - "8081"
    deploy:
      replicas: ${TREND_REPLICAS:-2}
    restart: on-failure:5

  ai-service:
    build:
      context: .
      dockerfile: cmd/ai-service/Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5

  fb-ads-service:
    build:
      context: .
      dockerfile: cmd/fb-ads-service/Dockerfile
    environment:
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5
    # Mỗi bản sao chạy 1 actor Apify một lúc (run-sync) → nhiều bản sao = nhiều query FB song song.
    # Không map cổng ra host (trùng cổng khi scale); gateway gọi gRPC qua mạng nội bộ.
    expose:
      - "8082"
    deploy:
      replicas: ${FBADS_REPLICAS:-8}

  crawl4ai-service:
    build:
      context: ./crawl4ai-service
    deploy:
      replicas: ${CRAWL4AI_REPLICAS:-2}
    restart: on-failure:5

  product-extractor-service:
    build:
      context: .
      dockerfile: cmd/product-extractor-service/Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      crawl4ai-service:
        condition: service_started
    # Mỗi bản sao xử lý 1 job fbads một lúc, trong job bóc song song `Concurrency` URL (mặc định 4).
    # Model OpenRouter `:free` giới hạn request/phút — tăng bản sao thì nên đổi sang model trả phí.
    deploy:
      replicas: ${EXTRACTOR_REPLICAS:-4}
    restart: on-failure:5

  niche-research-service:
    build:
      context: .
      dockerfile: cmd/niche-research-service/Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8084:8084"
    restart: on-failure:5

  amazon-service:
    build:
      context: .
      dockerfile: cmd/amazon-service/Dockerfile
    environment:
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5
    expose:
      - "8085"
    deploy:
      replicas: ${AMAZON_REPLICAS:-2}

  china1688-service:
    build:
      context: .
      dockerfile: cmd/china1688-service/Dockerfile
    environment:
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5
    ports:
      - "8086:8086"

  reddit-service:
    build:
      context: .
      dockerfile: cmd/reddit-service/Dockerfile
    environment:
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5
    ports:
      - "8087:8087"

  reddit-api-service:
    build:
      context: .
      dockerfile: cmd/reddit-api-service/Dockerfile
    environment:
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5
    ports:
      - "8088:8088"

  api-gateway:
    build:
      context: .
      dockerfile: cmd/api-gateway/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      trend-service:
        condition: service_started
      fb-ads-service:
        condition: service_started
      amazon-service:
        condition: service_started
      china1688-service:
        condition: service_started
      reddit-service:
        condition: service_started
      reddit-api-service:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "8888:8888"
    restart: on-failure:5

volumes:
  pgdata:
