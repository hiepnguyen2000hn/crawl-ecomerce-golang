services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crawl
      POSTGRES_USER: crawl
      POSTGRES_PASSWORD: crawl
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawl -d crawl"]
      interval: 2s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./db/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-path", "/migrations", "-database", "postgres://crawl:crawl@postgres:5432/crawl?sslmode=disable", "up"]
    restart: "no"

  trend-service:
    build:
      context: .
      dockerfile: cmd/trend-service/Dockerfile
    environment:
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    restart: on-failure:5

  ai-service:
    build:
      context: .
      dockerfile: cmd/ai-service/Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5

  fb-ads-service:
    build:
      context: .
      dockerfile: cmd/fb-ads-service/Dockerfile
    environment:
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
    volumes:
      # Downloaded ad images. A host directory, not a named volume, so that
      # `docker compose down -v` cannot delete them and nginx can serve them.
      - ${MEDIA_HOST_DIR:-./data/media}:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5
    ports:
      - "8082:8082"

  crawl4ai-service:
    build:
      context: ./crawl4ai-service
    restart: on-failure:5

  product-extractor-service:
    build:
      context: .
      dockerfile: cmd/product-extractor-service/Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      crawl4ai-service:
        condition: service_started
    restart: on-failure:5

  niche-research-service:
    build:
      context: .
      dockerfile: cmd/niche-research-service/Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8084:8084"
    restart: on-failure:5

  amazon-service:
    build:
      context: .
      dockerfile: cmd/amazon-service/Dockerfile
    environment:
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5
    ports:
      - "8085:8085"

  china1688-service:
    build:
      context: .
      dockerfile: cmd/china1688-service/Dockerfile
    environment:
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5
    ports:
      - "8086:8086"

  reddit-service:
    build:
      context: .
      dockerfile: cmd/reddit-service/Dockerfile
    environment:
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5
    ports:
      - "8087:8087"

  reddit-api-service:
    build:
      context: .
      dockerfile: cmd/reddit-api-service/Dockerfile
    environment:
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5
    ports:
      - "8088:8088"

  apify-token-service:
    build:
      context: .
      dockerfile: cmd/apify-token-service/Dockerfile
    environment:
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8089:8089"
    restart: on-failure:5

  allegro-service:
    build:
      context: .
      dockerfile: cmd/allegro-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ALLEGRO_PROXY: ${ALLEGRO_PROXY:-}
      # Path INSIDE the container to a Webshare-style proxy list (host:port:user:pass).
      # Mount the host file via the volumes block below and point this at it.
      ALLEGRO_PROXY_FILE: ${ALLEGRO_PROXY_FILE:-}
      # Webshare API key: fetch.py pulls the proxy pool from the Webshare API.
      # Takes priority over ALLEGRO_PROXY_FILE; no file mount needed when set.
      WEBSHARE_API_KEY: ${WEBSHARE_API_KEY:-}
    # volumes:
    #   - ${ALLEGRO_PROXY_FILE_HOST:-./scripts/proxy-test/Webshare 100 proxies.txt}:/app/proxies.txt:ro
    ports:
      - "8090:8089"
    restart: on-failure:5

  linkedin-service:
    build:
      context: .
      dockerfile: cmd/linkedin-service/Dockerfile
    environment:
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5

  kalodata-service:
    build:
      context: .
      dockerfile: cmd/kalodata-service/Dockerfile
    environment:
      # Primary: path INSIDE the container to kalodata_full_info.json
      # (array of {session_cookie, device_id, proxy}). Mount it via volumes below.
      KALODATA_ACCOUNTS_FILE: ${KALODATA_ACCOUNTS_FILE:-/app/kalodata_accounts.json}
      # Fallback: one Cookie header per line (no proxy).
      KALODATA_COOKIES: ${KALODATA_COOKIES:-}
    volumes:
      - ${KALODATA_ACCOUNTS_FILE_HOST:-./kalodata_full_info.json}:/app/kalodata_accounts.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure:5

  api-gateway:
    build:
      context: .
      dockerfile: cmd/api-gateway/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      trend-service:
        condition: service_started
      fb-ads-service:
        condition: service_started
      amazon-service:
        condition: service_started
      china1688-service:
        condition: service_started
      reddit-service:
        condition: service_started
      reddit-api-service:
        condition: service_started
      allegro-service:
        condition: service_started
      linkedin-service:
        condition: service_started
      kalodata-service:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "8888:8888"
    restart: on-failure:5

volumes:
  pgdata:
