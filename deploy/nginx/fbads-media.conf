# Serves images downloaded by fb-ads-service.
# Install: sudo cp deploy/nginx/fbads-media.conf /etc/nginx/snippets/
# then add `include snippets/fbads-media.conf;` inside your server { } block.
# The alias must match MEDIA_HOST_DIR in .env (with a trailing slash).
location /media/ {
    alias /srv/crawl/media/;
    autoindex off;
    try_files $uri =404;

    types {
        image/jpeg jpg;
        image/png  png;
        image/webp webp;
        image/gif  gif;
    }
    default_type application/octet-stream;

    # A file's path is fixed per ad and image slot, and is written once.
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options nosniff;
    access_log off;
}
